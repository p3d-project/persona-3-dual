name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          submodules: recursive

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen
        run: |
          mkdir -p docs/doxygen
          doxygen Doxyfile

      - name: Deploy
        id: deploy_docs
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/doxygen/html --project-name=persona-3-dual --branch=${{ github.head_ref }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy_docs.outputs.pages-deployment-alias-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployed!**\n\nTake a peek over at: ${process.env.PREVIEW_URL}`
            })
