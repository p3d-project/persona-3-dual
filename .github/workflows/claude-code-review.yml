name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time: a new push cancels the in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs don't receive repository secrets, so skip them cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Inline comments + outcome comment. No issues: write, so a compromised
      # run can't touch issues; if commenting 403s, add `issues: write` back.
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      # continue-on-error so the outcome comment below ALWAYS gets posted;
      # a later step re-fails the job if the review itself failed.
      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only gh calls plus inline comments. The review instructions
          # below are adapted from Anthropic's code-review plugin
          # (anthropics/claude-plugins-official, plugins/code-review) and kept
          # inline so they only change with a commit to this repo.
          claude_args: >-
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate)"
          prompt: |
            Provide a code review for pull request ${{ github.repository }}#${{ github.event.pull_request.number }}
            (head commit ${{ github.event.pull_request.head.sha }}).

            You are running non-interactively in CI. Wait for every subagent or
            background check to finish before continuing, and never end your turn
            with a "still running" or "I'll continue when..." message. Complete the
            full review in this run.

            This workflow re-runs on every push to the PR, so earlier comments from
            Claude or github-actions[bot] on this PR are expected. They are never a
            reason to skip the review.

            **Agent assumptions (applies to all agents and subagents):**
            - All tools are functional and will work without error. Do not test tools or make exploratory calls. Make sure this is clear to every subagent that is launched.
            - Only call a tool if it is required to complete the task. Every tool call should have a clear purpose.

            To do this, follow these steps precisely:

            1. Launch a haiku agent to check if either of the following is true:
               - The pull request is closed
               - The pull request is a draft

               If either is true, do not review. End your final message with a one-line
               outcome saying the review was skipped and why.

            2. Launch a sonnet agent to view the pull request and return a summary of the changes.

            3. Launch 2 agents in parallel to independently review the changes. Each agent should return the list of issues, where each issue includes a description and the reason it was flagged (e.g. "bug", "security"). The agents should do the following:

               Agent 1: Opus bug agent (parallel subagent with agent 2)
               Scan for obvious bugs. Focus only on the diff itself without reading extra context. Flag only significant bugs; ignore nitpicks and likely false positives. Do not flag issues that you cannot validate without looking at context outside of the git diff.

               Agent 2: Opus bug agent (parallel subagent with agent 1)
               Look for problems that exist in the introduced code. This could be security issues, incorrect logic, etc. Only look for issues that fall within the changed code.

               **CRITICAL: We only want HIGH SIGNAL issues.** Flag issues where:
               - The code will fail to compile or parse (syntax errors, type errors, missing imports, unresolved references)
               - The code will definitely produce wrong results regardless of inputs (clear logic errors)

               Do NOT flag:
               - Code style or quality concerns
               - Potential issues that depend on specific inputs or state
               - Subjective suggestions or improvements

               If you are not certain an issue is real, do not flag it. False positives erode trust and waste reviewer time.

               In addition to the above, each subagent should be told the PR title and description. This will help provide context regarding the author's intent.

            4. For each issue found in the previous step, launch parallel Opus subagents to validate the issue. These subagents should get the PR title and description along with a description of the issue. The agent's job is to review the issue to validate that the stated issue is truly an issue with high confidence. For example, if an issue such as "variable is not defined" was flagged, the subagent's job would be to validate that is actually true in the code.

            5. Filter out any issues that were not validated in step 4. This step will give us our list of high signal issues for our review.

            6. Fetch the existing inline review comments with
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
               and drop any issue that has already been raised there (same problem at the
               same location), so re-runs do not post duplicates.

            7. If no issues remain, do not post anything to GitHub; go straight to the outcome summary.
               Otherwise, create a list of all comments that you plan on leaving. This is only for you to make sure you are comfortable with the comments. Do not post this list anywhere.

            8. Post inline comments for each remaining issue using `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`. For each comment:
               - Provide a brief description of the issue
               - For small, self-contained fixes, include a committable suggestion block
               - For larger fixes (6+ lines, structural changes, or changes spanning multiple locations), describe the issue and suggested fix without a suggestion block
               - Never post a committable suggestion UNLESS committing the suggestion fixes the issue entirely. If follow up steps are required, do not leave a committable suggestion.

               **IMPORTANT: Only post ONE comment per unique issue. Do not post duplicate comments.**

            Use this list when evaluating issues in Steps 3 and 4 (these are false positives, do NOT flag):

            - Pre-existing issues
            - Something that appears to be a bug but is actually correct
            - Pedantic nitpicks that a senior engineer would not flag
            - Issues that a linter will catch (do not run the linter to verify)
            - General code quality concerns (e.g., lack of test coverage, general security issues)
            - Issues explicitly silenced in the code (e.g., via a lint ignore comment)

            Notes:

            - Use gh CLI to interact with GitHub (e.g., fetch pull requests). Do not use web fetch.
            - Do not post top-level PR comments; the workflow posts the outcome comment itself.
            - Create a todo list before starting.
            - This repository intentionally has no CLAUDE.md, AGENTS.md or similar agent instruction file. Do not look for one, mention its absence, or suggest adding one.
            - When linking to code in inline comments, follow the following format precisely, otherwise the Markdown preview won't render correctly: https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/path/to/file.cpp#L10-L15
              - Requires full git sha
              - You must provide the full sha. Commands like `https://github.com/owner/repo/blob/$(git rev-parse HEAD)/foo/bar` will not work, since your comment will be directly rendered in Markdown.
              - Repo name must match the repo you're code reviewing
              - # sign after the file name
              - Line range format is L[start]-L[end]
              - Provide at least 1 line of context before and after, centered on the line you are commenting about (eg. if you are commenting about lines 5-6, you should link to `L4-7`)

            When the review is complete, end your final message with a markdown
            outcome summary: a checklist of dimensions reviewed (correctness,
            security, tests, conventions), findings counted by severity, and a
            one-line verdict such as "✅ no blocking issues" or "❌ N issues to fix".

      # Deterministic outcome comment: does NOT depend on Claude choosing to
      # comment. Extracts Claude's final message from the execution log and
      # posts it (with the job status) via gh. Runs on success AND failure.
      - name: Post outcome comment on PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            SUMMARY=$(jq -r '
              [.[] | select(.type == "assistant")] | last
              | .message.content // []
              | map(select(.type == "text") | .text)
              | join("\n\n")
            ' "$EXECUTION_FILE" 2>/dev/null || true)
          fi

          if [ "$REVIEW_OUTCOME" = "success" ]; then
            STATUS_LINE="✅ Review job completed."
          else
            STATUS_LINE="❌ Review job **failed** — see the [run log]($RUN_URL)."
          fi

          # Hidden marker so we only ever update OUR comment, never another
          # github-actions comment (e.g. the docs "Preview Deployed" one).
          MARKER='<!-- claude-code-review-outcome -->'

          {
            echo "$MARKER"
            echo "## 🤖 Claude Code Review — outcome"
            echo
            echo "$STATUS_LINE"
            echo
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "_No summary was produced by the review run._"
            fi
            echo
            echo "---"
            echo "_Run: [$RUN_URL]($RUN_URL) · commit ${GITHUB_SHA:0:7}_"
          } > /tmp/outcome-comment.md

          # Update our previous outcome comment (found by marker); otherwise create one.
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" \
            | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@/tmp/outcome-comment.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/outcome-comment.md
          fi

      - name: Fail the job if the review failed
        if: steps.claude-review.outcome == 'failure'
        run: exit 1
