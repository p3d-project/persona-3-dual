name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time: a new push cancels the in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs don't receive repository secrets, so skip them cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post the outcome comment on the PR
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # continue-on-error so the outcome comment below ALWAYS gets posted;
      # a later step re-fails the job if the review itself failed.
      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model sonnet'
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            When the review is complete, end your final message with a markdown
            outcome summary: a checklist of dimensions reviewed (correctness,
            security, tests, conventions), findings counted by severity, and a
            one-line verdict such as "✅ no blocking issues" or "❌ N issues to fix".

      # Deterministic outcome comment: does NOT depend on Claude choosing to
      # comment. Extracts Claude's final message from the execution log and
      # posts it (with the job status) via gh. Runs on success AND failure.
      - name: Post outcome comment on PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            SUMMARY=$(jq -r '
              [.[] | select(.type == "assistant")] | last
              | .message.content // []
              | map(select(.type == "text") | .text)
              | join("\n\n")
            ' "$EXECUTION_FILE" 2>/dev/null || true)
          fi

          if [ "$REVIEW_OUTCOME" = "success" ]; then
            STATUS_LINE="✅ Review job completed."
          else
            STATUS_LINE="❌ Review job **failed** — see the [run log]($RUN_URL)."
          fi

          # Hidden marker so we only ever update OUR comment, never another
          # github-actions comment (e.g. the docs "Preview Deployed" one).
          MARKER='<!-- claude-code-review-outcome -->'

          {
            echo "$MARKER"
            echo "## 🤖 Claude Code Review — outcome"
            echo
            echo "$STATUS_LINE"
            echo
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "_No summary was produced by the review run._"
            fi
            echo
            echo "---"
            echo "_Run: [$RUN_URL]($RUN_URL) · commit ${GITHUB_SHA:0:7}_"
          } > /tmp/outcome-comment.md

          # Update our previous outcome comment (found by marker); otherwise create one.
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" \
            | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@/tmp/outcome-comment.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/outcome-comment.md
          fi

      - name: Fail the job if the review failed
        if: steps.claude-review.outcome == 'failure'
        run: exit 1
